<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIHADIR - Konfirmasi Absen Ketua</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container container-reverse konfirmasi-layout">
    <div class="illustration-panel">
      <img src="./assets/desk_illustration.png" alt="Ilustrasi Meja Belajar Estetik" class="illustration">
    </div>
    
    <div class="form-panel konfirmasi-panel">
      <div class="konfirmasi-card">
        <div class="success-icon-wrapper">
          <div class="success-icon-bg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        </div>
        
        <h1 class="success-title">Selamat!</h1>
        <p class="success-subtitle">Kamu Sudah Absen</p>
        
        <div class="data-box">
          <div class="data-item">
            <svg class="data-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span class="data-label">TANGGAL</span>
            <span class="data-value">22 Okt 2026</span>
          </div>
          <div class="data-divider"></div>
          <div class="data-item">
            <svg class="data-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span class="data-label">STATUS</span>
            <span class="data-value text-orange">Hadir</span>
          </div>
          <div class="data-divider"></div>
          <div class="data-item">
            <svg class="data-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span class="data-label">WAKTU</span>
            <span class="data-value">06:36 WIB</span>
          </div>
        </div>
        
        <div class="quote-box">
          <div class="quote-mark">“</div>
          <div class="quote-label">KATA HARI INI</div>
          <p class="quote-text">"Pendidikan adalah senjata paling ampuh yang dapat kamu gunakan untuk mengubah dunia."</p>
          <div class="quote-author">— NELSON MANDELA</div>
        </div>
        
        <button class="btn-register btn-submit-absen" onclick="window.location.href='dashboard-ketua.html'">Kembali ke Dashboard</button>
      </div>
    </div>
  </div>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/attendance.js"></script>
<script src="assets/js/dashboard.js"></script>
<script src="assets/js/review.js"></script>
</body>
</html>
