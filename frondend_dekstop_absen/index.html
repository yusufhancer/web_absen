<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIHADIR - Sistem Absensi Masa Depan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <header class="logo">
        <h1>SIHADIR</h1>
      </header>
      
      <main class="content">
        <h2 class="title">Sistem Absensi<br>Masa Depan</h2>
        <p class="subtitle">Absensi lebih cepat, belajar lebih tenang.</p>
        
        <div class="button-group">
          <button class="btn btn-primary" onclick="window.location.href='register-pelajar.html'">Masuk sebagai<br>Pelajar</button>
          <button class="btn btn-secondary" onclick="window.location.href='login-petugas.html'">Masuk sebagai<br>Petugas</button>
        </div>
        
        <div class="social-proof">
          <div class="avatars">
            <img src="https://i.pravatar.cc/100?img=1" alt="User 1" class="avatar">
            <img src="https://i.pravatar.cc/100?img=2" alt="User 2" class="avatar">
            <img src="https://i.pravatar.cc/100?img=3" alt="User 3" class="avatar">
            <div class="avatar-count">+1k</div>
          </div>
          <div class="proof-text">
            <strong>1k+</strong><br>
            <span>Digunakan oleh ribuan siswa setiap hari</span>
          </div>
        </div>
      </main>
    </div>
    
    <div class="right-panel">
      <img src="./assets/desk_illustration.png" alt="Ilustrasi Meja Belajar Estetik" class="illustration">
    </div>
  </div>
</body>
</html>
