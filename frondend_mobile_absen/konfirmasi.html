<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absensi Berhasil - SIHADIR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="confirmation-page" aria-label="Konfirmasi absensi berhasil">
      <section class="confirmation-hero">
        <div class="success-badge">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m5 12 4 4 10-10" />
          </svg>
        </div>
        <h1>Selamat! Kamu Sudah Absen</h1>
        <p>Terima kasih sudah hadir hari ini. Tetap semangat belajarnya!</p>
      </section>

      <section class="confirmation-card" aria-label="Detail absensi">
        <div class="summary-row">
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 2v4" />
              <path d="M17 2v4" />
              <path d="M4 8h16" />
              <path d="M5 4h14v17H5z" />
              <path d="M8 12h2" />
              <path d="M12 12h2" />
              <path d="M8 16h2" />
              <path d="M12 16h2" />
            </svg>
            Tanggal
          </span>
          <strong>Senin, 24 Okt 2023</strong>
        </div>
        <div class="summary-row">
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" />
              <path d="M12 11v5" />
              <path d="M12 8h.01" />
            </svg>
            Status
          </span>
          <em>Hadir</em>
        </div>
        <div class="summary-row">
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" />
              <path d="M12 7v5l3 2" />
            </svg>
            Waktu
          </span>
          <strong>07:30 WIB</strong>
        </div>

        <article class="daily-note">
          <h2>KATA HARI INI</h2>
          <blockquote>
            "Pendidikan adalah senjata paling mematikan di dunia, karena dengan pendidikan, Anda dapat mengubah dunia."
          </blockquote>
        </article>
      </section>

      <div class="confirmation-footer">
        <a class="back-dashboard-button" href="dashboard.html">Kembali ke Dashboard</a>
        <p>SIHADIR</p>
      </div>
    </main>
  <script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/attendance.js"></script>
<script src="assets/js/dashboard.js"></script>
<script src="assets/js/review.js"></script>
</body>
</html>
